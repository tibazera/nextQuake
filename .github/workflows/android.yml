name: android

# Builds the Android Debug APK (arm64, Vulkan) on every push and pull request,
# so a broken build shows up before anyone compiles it locally.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      NDK_VERSION: 28.2.13676358
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"

    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        submodules: recursive
        fetch-depth: 0

    - name: Install host tools
      run: |
        sudo apt-get -qq update
        sudo apt-get -qq install --no-install-recommends glslang-tools ninja-build autoconf automake libtool pkg-config

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: "17"

    - name: Set up Android SDK
      uses: android-actions/setup-android@v3

    - name: Install NDK
      run: |
        sdkmanager --install "ndk;${NDK_VERSION}" "cmake;3.22.1"
        echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"

    - name: Restore vcpkg binary cache
      uses: actions/cache@v4
      with:
        path: .vcpkg-cache
        key: vcpkg-arm64-android-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'cmake/triplets/**') }}-${{ hashFiles('.git/modules/vcpkg/HEAD') }}
        restore-keys: vcpkg-arm64-android-

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Build Debug APK
      run: |
        mkdir -p .vcpkg-cache
        chmod +x gradlew
        ./gradlew --no-daemon :app:assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: nextQuake-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
