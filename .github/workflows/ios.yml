name: iOS

on:
  push:
    branches: [ios]
  workflow_dispatch:

env:
  MOLTENVK_VERSION: v1.3.0
  VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/.vcpkg-cache,readwrite"

jobs:
  simulator:
    name: Build and smoke test (iOS simulator)
    runs-on: macos-15
    timeout-minutes: 90

    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0

    - name: Fetch upstream tags for version metadata
      run: |
        git remote add upstream https://github.com/QW-Group/ezquake-source.git
        git fetch --tags --no-recurse-submodules upstream

    - name: Install host tools
      run: brew install -q glslang

    - name: Library build type release
      # avoids building -dbg and -rel copies of every static library
      run: |
        for x in vcpkg/triplets/community/arm64-ios-simulator.cmake; do
          echo >> $x
          echo 'set(VCPKG_BUILD_TYPE release)' >> $x
        done

    - name: Restore vcpkg binary cache
      uses: actions/cache@v4
      with:
        path: .vcpkg-cache
        key: vcpkg-ios-sim-${{ hashFiles('vcpkg.json', '.git/modules/vcpkg/HEAD') }}
        restore-keys: vcpkg-ios-sim-

    - name: Download MoltenVK
      run: |
        mkdir -p .moltenvk
        curl -sSfL "https://github.com/KhronosGroup/MoltenVK/releases/download/${MOLTENVK_VERSION}/MoltenVK-all.tar" | tar -x -C .moltenvk
        find .moltenvk -path '*static*' -name 'libMoltenVK.a'
        echo "MOLTENVK_LIBRARY=$(find "$PWD/.moltenvk" -path '*static*' -path '*ios-*simulator*' -name 'libMoltenVK.a' | head -1)" >> "$GITHUB_ENV"

    - name: Bootstrap vcpkg
      run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

    - name: Configure
      run: cmake --preset ios-simulator-arm64 -DMOLTENVK_LIBRARY="$MOLTENVK_LIBRARY"

    - name: Build
      run: |
        set -o pipefail
        cmake --build build-ios-simulator-arm64 --config Debug -- -quiet CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log

    - name: Smoke test in the simulator
      id: smoke
      run: |
        APP=$(find build-ios-simulator-arm64 -name 'nextQuake.app' -type d | head -1)
        DEVICE=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; print(next(x["udid"] for k,v in d.items() if "iOS" in k for x in v if x["name"].startswith("iPhone")))')
        xcrun simctl boot "$DEVICE"
        xcrun simctl bootstatus "$DEVICE" -b
        xcrun simctl install "$DEVICE" "$APP"
        DOCS="$(xcrun simctl get_app_container "$DEVICE" org.nextquake.ios data)/Documents"
        # no data copied: the app must download it on first run (ios_gamedata.c)
        ( xcrun simctl launch --console-pty --terminate-running-process "$DEVICE" org.nextquake.ios > app.log 2>&1 & )
        sleep 20
        xcrun simctl io "$DEVICE" screenshot download.png || true
        for i in $(seq 1 30); do [ -s "$DOCS/id1/pak0.pak" ] && [ -s "$DOCS/qw/ktx.pk3" ] && break; sleep 10; done
        ls -la "$DOCS" "$DOCS/id1" || true
        echo "downloaded=$(find "$DOCS" -type f | wc -l)" >> "$GITHUB_OUTPUT"
        sleep 40
        xcrun simctl io "$DEVICE" screenshot screenshot.png || true
        xcrun simctl spawn "$DEVICE" log show --last 2m --predicate 'process == "nextQuake"' > system.log 2>&1 || true
        if xcrun simctl spawn "$DEVICE" launchctl list | grep -q org.nextquake.ios; then echo "running=yes" >> "$GITHUB_OUTPUT"; else echo "running=no" >> "$GITHUB_OUTPUT"; fi
        xcrun simctl shutdown "$DEVICE"
        # crash reports of the app and of the simulator's Metal host
        mkdir -p crashes
        find ~/Library/Logs/DiagnosticReports -newer app.log -o -name '*nextQuake*' -o -name '*SimMetalHost*' 2>/dev/null | grep -iE 'nextquake|metal' | xargs -I{} cp {} crashes/ 2>/dev/null || true
        ls -la crashes

    - name: Upload results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ios-simulator
        path: |
          build.log
          app.log
          system.log
          screenshot.png
          download.png
          crashes/
          build-ios-simulator-arm64/**/nextQuake.app
        if-no-files-found: ignore

    - name: Fail if the first-run download did not finish
      if: steps.smoke.outputs.downloaded < 50
      run: |
        grep -i gamedata app.log system.log || true
        exit 1

    - name: Fail if the app did not stay up
      if: steps.smoke.outputs.running == 'no'
      run: |
        tail -n 80 app.log || true
        exit 1

  device:
    name: Unsigned IPA (iPhone/iPad)
    runs-on: macos-15
    timeout-minutes: 90

    steps:
    - name: Check out code
      uses: actions/checkout@v4
      with:
        submodules: true
        fetch-depth: 0

    - name: Fetch upstream tags for version metadata
      run: |
        git remote add upstream https://github.com/QW-Group/ezquake-source.git
        git fetch --tags --no-recurse-submodules upstream

    - name: Install host tools
      run: brew install -q glslang

    - name: Library build type release
      run: |
        echo >> vcpkg/triplets/community/arm64-ios.cmake
        echo 'set(VCPKG_BUILD_TYPE release)' >> vcpkg/triplets/community/arm64-ios.cmake

    - name: Restore vcpkg binary cache
      uses: actions/cache@v4
      with:
        path: .vcpkg-cache
        key: vcpkg-ios-device-${{ hashFiles('vcpkg.json', '.git/modules/vcpkg/HEAD') }}
        restore-keys: vcpkg-ios-device-

    - name: Download MoltenVK
      run: |
        mkdir -p .moltenvk
        curl -sSfL "https://github.com/KhronosGroup/MoltenVK/releases/download/${MOLTENVK_VERSION}/MoltenVK-all.tar" | tar -x -C .moltenvk
        echo "MOLTENVK_LIBRARY=$(find "$PWD/.moltenvk" -path '*static*' -path '*ios-arm64/*' -name 'libMoltenVK.a' | grep -v simulator | head -1)" >> "$GITHUB_ENV"

    - name: Bootstrap vcpkg
      run: ./vcpkg/bootstrap-vcpkg.sh -disableMetrics

    - name: Configure
      run: cmake --preset ios-arm64 -DMOLTENVK_LIBRARY="$MOLTENVK_LIBRARY"

    - name: Build
      run: |
        set -o pipefail
        cmake --build build-ios-arm64 --config Release -- -quiet CODE_SIGNING_ALLOWED=NO 2>&1 | tee build.log

    - name: Package unsigned IPA
      # sign it on install with AltStore / Sideloadly and a free Apple ID
      run: |
        APP=$(find build-ios-arm64 -name 'nextQuake.app' -type d | head -1)
        mkdir Payload
        cp -R "$APP" Payload/
        zip -qry nextQuake-unsigned.ipa Payload
        ls -la nextQuake-unsigned.ipa

    - name: Upload IPA
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: ios-device
        path: |
          nextQuake-unsigned.ipa
          build.log
        if-no-files-found: ignore
